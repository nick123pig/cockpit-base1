name: Build & Stage to npm

# Builds cockpit-base1 for every cockpit release >= STAGE_START (auto-discovered
# from GitHub, unbounded) in one sequential loop, and pushes each
# into npm's staging area (npm stage publish). Releases only happen when you
# Approve on npmjs.com - CI has no tokens, no secrets, no OTP. Auth is npm
# trusted publishing (OIDC) against this repo + workflow filename configured
# in the package settings on npmjs.com.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write # stage-manifest artifact upload/download
  id-token: write # required for trusted publishing

concurrency:
  group: stage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # ~40s per release once; fast thereafter (fingerprint skip)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # npm stage publish requires Node >= 22.14
          # No registry-url here! That would make setup-node inject a dummy
          # NODE_AUTH_TOKEN, which overrides the OIDC path and breaks
          # trusted publishing (ENEEDAUTH). OIDC needs to be the only auth.

      - name: Ensure npm CLI 11
        run: npm install -g npm@11

      # Cross-run memory for the fingerprint skip: pull the stage-manifest
      # artifact from the most recent run that produced one, so versions still
      # pending approval are skipped instead of rebuilt+re-staged.
      - name: Load previous stage manifest
        run: |
          mkdir -p state
          for id in $(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?per_page=10" --jq '.workflow_runs[].id' 2>/dev/null); do
            if gh run download "$id" --name stage-manifest --dir state --quiet 2>/dev/null; then
              break
            fi
          done
          if [[ -f state/stage-manifest/stage-manifest.json ]]; then
            mv state/stage-manifest/stage-manifest.json state/stage-manifest.json
            rmdir state/stage-manifest 2>/dev/null || true
            echo "::notice::Loaded stage manifest: $(jq -r 'keys | length' state/stage-manifest.json) tags recorded"
          else
            echo "::notice::No prior stage manifest - first run will build everything"
          fi

      # Discover the full cockpit release list from GitHub (unbounded: new
      # cockpit releases are picked up automatically), then keep those >= the
      # starting number. STAGE_START is the one knob to adjust.
      - name: Discover cockpit releases
        id: releases
        env:
          STAGE_START: "311"
        run: |
          set -uo pipefail
          versions="$(gh api 'repos/cockpit-project/cockpit/releases?per_page=100' --paginate \
              --jq '.[] | select(.draft != true) | .tag_name' 2>/dev/null \
            | grep -E '^[0-9]+([.][0-9]+)?$' \
            | awk -F. -v s="$STAGE_START" 'NF <= 2 && $1 >= s' \
            | sort -t. -k1,1n -k2,2n | tr '\n' ' ')"
          if [[ -z "${versions// /}" ]]; then
            echo "::error::No cockpit releases found >= $STAGE_START (GitHub API failed?)"
            exit 1
          fi
          echo "STAGE_VERSIONS=$versions" >> "$GITHUB_ENV"

      - name: Build and stage all versions
        env:
          STAGE_MANIFEST: state/stage-manifest.json
        run: |
          set -uo pipefail
          echo "::notice::Staging cockpit versions: $STAGE_VERSIONS"
          echo "::notice::total versions: $(wc -w <<<"$STAGE_VERSIONS")"
          failures=()
          for v in $STAGE_VERSIONS; do
            echo "==================== staging version $v ===================="
            if ./build.sh stage-publish "$v"; then
              echo "::notice::staged $v"
            else
              echo "::warning::FAILED to stage $v"
              failures+=("$v")
            fi
            ./build.sh cleanup >/dev/null 2>&1 || true
          done
          echo "==================== summary ===================="
          echo "failed versions: ${failures[*]:-none}"
          if (( ${#failures[@]} > 0 )); then
            echo "::error::Failed to stage versions: ${failures[*]}"
            exit 1
          fi

      - name: Save stage manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-manifest
          path: state/stage-manifest.json
          if-no-files-found: ignore
          retention-days: 30